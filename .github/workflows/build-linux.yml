name: Build Linux Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux x64 AppImage and DEB
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and upload Linux packages
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: npm run tauri
          args: --bundles appimage,deb
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ordered-sokoban-[version]-linux-[arch]-[bundle]

      - name: Verify Linux package outputs
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)

          if (( ${#appimages[@]} == 0 )); then
            echo "Linux AppImage was not generated." >&2
            exit 1
          fi

          if (( ${#debs[@]} == 0 )); then
            echo "Linux DEB package was not generated." >&2
            exit 1
          fi

          printf 'Generated package: %s\n' "${appimages[@]}" "${debs[@]}"
